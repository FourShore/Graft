# Verifies the Graft records on a pull request: every commit that changed
# behavior must carry evidence that meets .graft/policy.json, and the recorded
# commands are re-run on the merge commit so a [pass] is a fact, not a claim.
# Other repos should not copy this file: `graft init --ci` writes a workflow that
# uses the reusable action (action.yml at the root of this repo). This one builds
# Graft from source first, so the check runs on the code under review.
name: Graft check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole branch, so base..HEAD is available.
          fetch-depth: 0
      - name: Fetch the Graft notes
        # The full records live on refs/notes/graft, which checkout does not
        # fetch. Without them a commit's evidence is read from its message, and
        # a record from before 0.0.6 (note only) would fail as unverifiable.
        run: git fetch origin '+refs/notes/graft:refs/notes/graft' || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the project so recorded commands can run
        run: npm ci
      - name: Build Graft
        # This repo is Graft itself, so the check runs from the build below.
        # In another repo replace this step with: npm install -g @fourshore/graft
        # and run `graft check ...` in the last step.
        run: npm run build
      - name: Graft check
        env:
          # Re-run recorded commands only for branches of this repository: a fork's
          # commit messages are text a stranger wrote, and the check would execute them.
          RERUN: ${{ github.event.pull_request.head.repo.full_name == github.repository && '--rerun' || '' }}
        run: node packages/cli/dist/cli.js check --base "origin/${{ github.event.pull_request.base.ref }}" --format github $RERUN

  # The reusable action other repos use (action.yml at the root), run from this
  # checkout so its plumbing (install, notes fetch, base resolution, flags) is
  # exercised on every pull request. It installs the published CLI, so it
  # checks this branch's records with the last release; re-runs stay off here
  # because the job above already runs them from the build.
  action:
    name: Graft check (reusable action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: ./
        with:
          rerun: "false"
