name: Release

# Publishes the @fourshore packages to npm when a version tag is pushed.
# Authenticates with npm trusted publishing (GitHub OIDC), so no token or
# secret is needed; each package on npm lists this repository and workflow
# as its trusted publisher.
#
#   npm run release -- patch   # bumps all packages, commits, tags
#   git push --follow-tags

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Trusted publishing needs npm 11.5 or newer; Node 22 ships an older one.
      - run: npm install -g npm@latest
      - run: npm ci
      # Build first: the review tests import @fourshore/graft-core, which
      # resolves to packages/core/dist.
      - run: npm run build
      - run: npm test
      # One package at a time, dependencies first, so there is never a moment
      # when the CLI is installable but the core it depends on is not.
      # (--workspaces publishes alphabetically: cli before core.)
      - run: npm publish -w packages/core --provenance --access public
      - run: npm publish -w packages/review --provenance --access public
      - run: npm publish -w packages/cli --provenance --access public
