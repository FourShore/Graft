name: Release

# Publishes @fourshore/graft to npm when a version tag is pushed.
# Requires an NPM_TOKEN repository secret with publish rights to the scope.
#
#   npm version patch   # bumps package.json and creates the tag
#   git push --follow-tags

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
